<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagrama de Casos de Uso v5.0 — Pizzaria Canto do Sabor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f0e0c;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
    font-family:'Sora',sans-serif;

    border:1px solid #2a2318;
    border-radius:16px;
    padding:32px;
    box-shadow:0 0 120px rgba(196,142,60,.06);
    overflow-x:auto;
    width:100%;
    max-width:1100px;
  }
  .legend {
    margin-top:28px; display:flex; flex-wrap:wrap;

  }
  .legend-item {
    display:flex; align-items:center; gap:8px;

<body>

  <p>Sistema de Gestão Financeira — Pizzaria "Canto do Sabor" &nbsp;|&nbsp; UML 2.x</p>
</div>
